name: Release Please

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ github.token }}
          target-branch: main
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
