name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency: publish-npm

jobs:
  publish:
    name: Publish package
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check package version matches tag
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: package.json version ($PACKAGE_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Validate package is not private
        run: node -e "const {private:p}=require('./package.json'); if(p){throw new Error('package.json is private; refusing to publish');}"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type checker
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build project
        run: npm run build

      - name: Ensure build produced no tracked changes
        run: git diff --exit-code

      - name: Pack artifact
        run: |
          mkdir -p tmp-toolchain
          rm -f tmp-toolchain/*.tgz
          npm pack --pack-destination tmp-toolchain/

      - name: Inspect tarball contents
        run: |
          TGZ=$(ls tmp-toolchain/*.tgz | head -n 1)
          echo "Contents of $TGZ"
          tar -tvf "$TGZ"

      - name: Upload pack artifact
        uses: actions/upload-artifact@v5
        with:
          name: npm-package
          path: tmp-toolchain/*.tgz

      - name: Publish to npm (OIDC)
        env:
          NPM_CONFIG_PROVENANCE: true
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: |
          set -eo pipefail
          TGZ=$(ls tmp-toolchain/*.tgz | head -n 1)
          if [ -z "$TGZ" ]; then
            echo "No package artifact found in tmp-toolchain"
            exit 1
          fi
          npm publish "$TGZ" --access public --provenance
