name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency: publish-npm

jobs:
  publish:
    name: Publish package
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Validate package is not private
        run: node -e "const {private:p}=require('./package.json'); if(p){throw new Error('package.json is private; refusing to publish');}"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type checker
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build project
        run: npm run build

      - name: Pack artifact
        run: |
          mkdir -p tmp-toolchain
          rm -f tmp-toolchain/*.tgz
          npm pack --pack-destination tmp-toolchain/

      - name: Inspect tarball contents
        run: |
          TGZ=$(ls tmp-toolchain/*.tgz | head -n 1)
          echo "Contents of $TGZ"
          tar -tvf "$TGZ"

      - name: Upload pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: tmp-toolchain/*.tgz

      - name: Verify npm token
        run: test -n "${NODE_AUTH_TOKEN:?NPM_TOKEN is required for publish}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
